name: SMILE AI Automation Core Verify

on:
  push:
    branches:
      - main
      - feature/ai-automation-core-large-media-20261005
    paths:
      - "automation-core/**"
      - ".github/workflows/ai-automation-core-verify.yml"
  pull_request:
    paths:
      - "automation-core/**"
      - ".github/workflows/ai-automation-core-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify group automation core
        working-directory: automation-core
        run: npm run verify
